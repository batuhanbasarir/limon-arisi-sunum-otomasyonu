services:
  - type: web
    name: limon-arisi-sunum
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    # NOT: Uygulama masaustu (bkz. backend/app/desktop_launcher.py, main.py) —
    # bu sunucuda sadece kucuk, OpenAI anahtarinin gizli kalmasi gereken
    # caption servisi (cloud_app.py) calisiyor. Video/gorsel dosyalari ve
    # .pptx uretimi tamamen kullanicinin kendi bilgisayarinda oluyor.
    # (web_app.py - tam bagimsiz, sifreli web surumu - web sitesi
    # entegrasyonu icin denenmisti, o fikirden vazgecildi; kod duruyor,
    # ileride gerekirse startCommand'i tekrar ona cevirebiliriz.)
    startCommand: uvicorn app.cloud_app:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Asagidaki ucu Render dashboard'unda "Environment" sekmesinden elle
      # girilir (sync: false -> repoya/commit'e yazılmaz, gizli kalır).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CAPTION_MODEL
        sync: false
      # Masaustu uygulamalarinin bu servise erismek icin gonderdigi ortak
      # anahtar (backend/app/_secrets.py - gitignore'lu - icinde ayni deger
      # .exe'ye/koda gomulu). Buradaki deger ile ayni olmali, yoksa
      # masaustu istekleri 401 alir.
      - key: APP_KEY
        sync: false
