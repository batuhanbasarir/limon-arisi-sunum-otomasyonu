services:
  - type: web
    name: limon-arisi-sunum
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    # NOT: Web sitesinden ("Limon Arısı uygulamaları" paneli) linklenebilecek
    # tam bagimsiz bir web uygulamasi olarak barinir (bkz. backend/app/
    # web_app.py) — sifreyle korunur, marka secimi + gorsel/video yukleme +
    # AI caption + .pptx uretimi hep bu serviste olur. Masaustu .exe
    # (backend/app/desktop_launcher.py, main.py) ve onun kucuk caption
    # servisi (cloud_app.py) ayri, kullanilmayan bir alternatif olarak
    # kodda duruyor - Windows'un imzasiz .exe'leri engellemesi (Smart App
    # Control) yuzunden guvenilir dagitilamadi.
    startCommand: uvicorn app.web_app:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Asagidakiler Render dashboard'unda "Environment" sekmesinden elle
      # girilir (sync: false -> repoya/commit'e yazılmaz, gizli kalır).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CAPTION_MODEL
        sync: false
      # Siteye girerken sorulan ortak kullanici adi/sifre (daha once
      # limonarisi / arisilimon olarak ayarlanmisti - dashboard'da hala
      # duruyor olmasi gerekir, degismediyse tekrar girmeye gerek yok).
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
